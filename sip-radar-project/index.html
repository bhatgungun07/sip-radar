<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html{color-scheme:light}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Sip Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;900&family=Figtree:wght@400;600;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout concept: sticker-pop poster split into pages. Home (neighbourhood tiles) > neighbourhood (map + 12 cafés) > café (menu, bill, map links). Budget, Saved and Updates sit in the top nav. Soft sage, sand and rose accents on a calm stone background; everything stays quiet. */
:root{
  --bg:#F3F2EE; --card:#FFFFFF; --ink:#1E2420; --muted:#5F6A64; --line:#C9CEC7; --shadow:rgba(30,36,32,.10);
  --pink:#7FB09C; --lime:#D3E2C6; --sun:#E7D3A1; --sky:#AFC8DA; --rose:#DDB5AB; --on-accent:#1E2420;
  --good:#2E7D55; --warn:#A8630A; --crit:#B3363F;
  --sea:#C3D9E6; --land:#F7F6F2; --road:#FFFFFF; --roadline:#DAD9D1; --park:#D2E4D2; --dot:#E0DFD8; --chip:#ECEBE6;
  --font-display:'Unbounded','Arial Black',system-ui,sans-serif;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'DM Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111513; --card:#1A201D; --ink:#ECEFEA; --muted:#9DA8A1; --line:#36403B; --shadow:rgba(0,0,0,.45);
  --pink:#86B8A4; --lime:#B7CFA8; --sun:#D6C38E; --sky:#9FBDD1; --rose:#CFA298;
  --good:#3DDC84; --warn:#FFB84D; --crit:#FF7B8E;
  --sea:#1E3544; --land:#161B18; --road:#2A332F; --roadline:#38423D; --park:#22372B; --dot:#222925; --chip:#232A26; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111513; --card:#1A201D; --ink:#ECEFEA; --muted:#9DA8A1; --line:#36403B; --shadow:rgba(0,0,0,.45);
  --pink:#86B8A4; --lime:#B7CFA8; --sun:#D6C38E; --sky:#9FBDD1; --rose:#CFA298;
  --good:#3DDC84; --warn:#FFB84D; --crit:#FF7B8E;
  --sea:#1E3544; --land:#161B18; --road:#2A332F; --roadline:#38423D; --park:#22372B; --dot:#222925; --chip:#232A26; color-scheme:dark}
 
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;line-height:1.08}
h1:focus{outline:none}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.lab{font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
 
/* nav */
.nav{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding-block:16px}
.logo{font-family:var(--font-display);font-weight:600;font-size:18px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;text-decoration:none}
.logo i{width:22px;height:22px;border-radius:50%;background:var(--pink);border:1.5px solid var(--line);display:inline-block;box-shadow:inset -5px -5px 0 var(--lime)}
.links{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:center}
.lt{display:grid;line-height:1.15}
.by{font-family:var(--font-body);font-weight:400;font-size:12px;letter-spacing:.06em;color:var(--muted)}
.nl{padding:6px 0;border:0;border-bottom:2px solid transparent;background:none;font-weight:600;font-size:14px;text-decoration:none;cursor:pointer;color:var(--muted);border-radius:0}
.nl:hover{color:var(--ink)}
.nl[aria-current="page"]{color:var(--ink);border-bottom-color:var(--pink)}
.nl .n{font-family:var(--font-mono);font-weight:500;margin-left:6px;background:var(--chip);border-radius:999px;padding:0 7px;font-size:12px}
.nl.theme{border:1.5px solid var(--line);border-radius:999px;padding:5px 14px;background:var(--card);color:var(--ink)}
 
/* shared parts */
.back{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 16px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px var(--shadow);margin-block:6px 14px}
.panel{border:1.5px solid var(--line);background:var(--card);border-radius:20px;box-shadow:0 8px 24px var(--shadow);min-width:0}
.pad{padding:18px;display:grid;gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:9px 14px;cursor:pointer;font-weight:700;text-decoration:none;box-shadow:0 2px 8px var(--shadow)}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px var(--shadow)}
.btn.pink{background:var(--pink);color:var(--on-accent)} .btn.lime{background:var(--lime);color:var(--on-accent)} .btn.sun{background:var(--sun);color:var(--on-accent)} .btn.sky{background:var(--sky);color:var(--on-accent)}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--chip);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:700;font-size:14px}
.chip[aria-pressed="true"]{background:var(--pink);color:var(--on-accent);box-shadow:0 2px 8px var(--shadow)}
.chip.lime[aria-pressed="true"]{background:var(--lime)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{border:1.5px solid var(--line);border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;background:var(--chip)}
.state{font-weight:700}.state.open{color:var(--good)}.state.closed{color:var(--crit)}
.price{font-family:var(--font-mono);font-weight:500;font-variant-numeric:tabular-nums}
.sec{margin-top:36px;display:grid;gap:14px}
.sec h2{font-size:clamp(22px,4vw,34px)}
.sechead{display:flex;justify-content:space-between;align-items:end;gap:10px;flex-wrap:wrap}
.field{display:grid;gap:4px;min-width:0;flex:1 1 180px}
.input{width:100%;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);padding:9px 12px;min-width:0}
input[type=range]{width:100%;accent-color:var(--pink)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.controls{display:grid;gap:14px;border:1.5px solid var(--line);background:var(--card);border-radius:20px;padding:16px;box-shadow:0 8px 24px var(--shadow)}
.empty{padding:24px;text-align:center;border:1.5px dashed var(--line);border-radius:18px}
.foot{margin-top:34px;font-size:13px;color:var(--muted);max-width:72ch}
 
/* hero */
.hero{position:relative;padding-block:14px 6px}
.hero h1{font-weight:600;font-size:clamp(38px,7.6vw,88px);letter-spacing:-.035em}
.hero h1 span{display:inline-block;background:var(--lime);color:var(--on-accent);padding:0 .15em;border:1.5px solid var(--line);border-radius:.18em;box-shadow:0 8px 24px var(--shadow)}
.hero p{max-width:54ch;font-size:17px;margin:18px 0 0;color:var(--muted)}
.sticker{position:absolute;right:0;top:6px;width:112px;height:112px;border-radius:50%;background:var(--pink);color:var(--on-accent);border:1.5px solid var(--line);display:grid;place-items:center;text-align:center;font-family:var(--font-display);font-weight:600;font-size:13px;line-height:1.1;box-shadow:0 8px 24px var(--shadow)}
.sticker b{font-size:28px;display:block}
.marquee{margin-top:22px;border:1.5px solid var(--line);background:var(--sun);color:var(--on-accent);border-radius:14px;overflow:hidden;box-shadow:0 8px 24px var(--shadow)}
.marquee div{display:flex;width:max-content;animation:slide 30s linear infinite;font-family:var(--font-display);font-weight:600;font-size:13px;letter-spacing:.08em;padding-block:9px}
.marquee span{padding-inline:18px;white-space:nowrap}
@keyframes slide{to{transform:translateX(-50%)}}
 
/* home */
.finder{display:grid;gap:10px}
.hits{display:grid;gap:8px}
.hit{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:14px;padding:9px 14px;text-decoration:none;background:var(--card)}
.hit:hover{background:var(--lime);color:var(--on-accent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.tile{display:grid;gap:10px;align-content:space-between;min-height:190px;border:1.5px solid var(--line);border-radius:22px;padding:18px;text-decoration:none;color:var(--on-accent);box-shadow:0 8px 24px var(--shadow);transition:transform .15s}
.tile:hover{transform:translateY(-3px)}
.tile.c0{background:var(--pink)}.tile.c1{background:var(--lime)}.tile.c2{background:var(--sun)}.tile.c3{background:var(--rose)}
.tile h3{font-size:24px}
.tile p{margin:6px 0 0;font-weight:600}
.tile .st{display:flex;flex-wrap:wrap;gap:6px 12px;font-family:var(--font-mono);font-size:13px;font-weight:500}
.tile .go{font-family:var(--font-display);font-weight:600;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{position:relative;display:grid;gap:8px;align-content:start;border:1.5px solid var(--line);background:var(--card);border-radius:18px;padding:14px;box-shadow:0 2px 8px var(--shadow)}
.card:hover{background:var(--chip)}
.card h3{font-size:16px;padding-right:34px}
.card .stretch{text-decoration:none}
.card .stretch::after{content:"";position:absolute;inset:0;border-radius:15px}
.card .meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px}
.card .bottom{display:flex;justify-content:space-between;align-items:center;gap:8px}
.heart{position:absolute;right:10px;top:10px;z-index:2;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--chip);cursor:pointer;font-size:16px;line-height:1}
.heart[aria-pressed="true"]{background:var(--pink);color:var(--on-accent)}
.news{display:grid;gap:8px}
.news ul{margin:0;padding-left:20px}
 
/* area page */
.ahead h1{font-weight:600;font-size:clamp(34px,6.5vw,64px);letter-spacing:-.03em}
.ahead p{margin:10px 0 0;font-size:17px;color:var(--muted);max-width:56ch}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.stat{border:1.5px solid var(--line);border-radius:14px;padding:8px 14px;background:var(--card)}
.stat b{display:block;font-family:var(--font-display);font-size:18px}
.areagrid{margin-top:22px;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr);gap:22px;align-items:start}
.sticky{position:sticky;top:calc(16px + env(safe-area-inset-top,0px))}
.mapbox{position:relative;aspect-ratio:1/1;overflow:hidden;border-radius:17px;max-width:100%}
.mapbox svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.pin{position:absolute;transform:translate(-50%,-100%);display:block;border:1.5px solid var(--line);border-radius:999px 999px 999px 4px;padding:3px 9px;font-family:var(--font-mono);font-size:12px;color:var(--on-accent);box-shadow:0 2px 8px var(--shadow);white-space:nowrap;text-decoration:none}
.pin.t1{background:var(--lime)}.pin.t2{background:var(--sun)}.pin.t3{background:var(--rose)}
.pin:hover,.pin:focus-visible{z-index:6;transform:translate(-50%,-100%) scale(1.2)}
.pin.dim{opacity:.22}
.pin.on{z-index:5;transform:translate(-50%,-100%) scale(1.25);outline:3px solid var(--ink)}
.maptag{position:absolute;left:10px;bottom:8px;font-family:var(--font-mono);font-size:11px;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:2px 8px}
 
/* cafe page */
.chead h1{font-weight:600;font-size:clamp(32px,6vw,58px);letter-spacing:-.03em}
.chead .sub{margin-top:8px;font-size:17px;color:var(--muted)}
.cgrid{margin-top:20px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
.col{display:grid;gap:22px;min-width:0}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.facts dt{font-family:var(--font-mono);font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-top:2px}
.facts dd{margin:0}
.menu{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.menu li{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:2px dashed var(--roadline);padding-bottom:8px}
.step{display:flex;align-items:center;gap:8px}
.step button{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:var(--chip);cursor:pointer;font-weight:700;line-height:1}
.step output{min-width:18px;text-align:center}
.bill{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:12px}
.bill big{font-family:var(--font-display);font-size:24px;display:block}
.split{display:flex;align-items:center;gap:8px}
.split input{width:64px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);padding:5px 8px}
 
/* budget */
.bgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.num{border:1.5px solid var(--line);border-radius:14px;padding:10px;background:var(--bg)}
.num b{display:block;font-family:var(--font-display);font-size:19px;overflow-wrap:anywhere}
.meter{height:26px;border:1.5px solid var(--line);border-radius:999px;background:var(--bg);overflow:hidden}
.meter i{display:block;height:100%;background:var(--good);width:0;transition:width .4s}
.meter.warn i{background:var(--warn)}.meter.crit i{background:var(--crit)}
.verdict{font-weight:700}.verdict.good{color:var(--good)}.verdict.warn{color:var(--warn)}.verdict.crit{color:var(--crit)}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,140px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.bar .track{height:16px;border:1.5px solid var(--line);border-radius:999px;background:var(--bg);overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--pink)}
.visits{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.visits li{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:2px dashed var(--roadline);padding-bottom:8px}
.visits button{border:1.5px solid var(--line);background:var(--chip);border-radius:8px;cursor:pointer;padding:2px 8px}
 
/* updates */
.rel{display:grid;gap:10px;padding:20px}
.rel header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.ver{background:var(--lime);color:var(--on-accent);border:1.5px solid var(--line);border-radius:999px;padding:2px 12px;font-family:var(--font-mono)}
.rel ul{margin:0;padding-left:20px;display:grid;gap:4px}
 
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:20}
 
@media (max-width:900px){
  .areagrid,.cgrid,.bgrid{grid-template-columns:minmax(0,1fr)}
  .sticky{position:static}
  .sticker{position:static;margin-top:14px;}
}
@media (max-width:480px){.nums{grid-template-columns:minmax(0,1fr)}.bar{grid-template-columns:90px minmax(0,1fr) auto}}
@media (prefers-reduced-motion:reduce){.marquee div{animation:none}.meter i,.tile{transition:none}.btn:hover,.tile:hover{transform:none}}
</style>
</head>
<body>
 
<div class="wrap">
  <nav class="nav" aria-label="Main">
    <a class="logo" href="#home"><i></i><span class="lt"><span>sip radar</span><span class="by">Gungun Bhat</span></span></a>
    <div class="links" id="links"></div>
  </nav>
  <main id="app"></main>
  <p class="foot"><b>Sip Radar · Gungun Bhat.</b> Café names, prices, hours and ratings are made-up sample data for this demo. Pins sit near the real neighbourhood, so the Google Maps and Apple Maps buttons open that area. Maps on this page are stylised and not to scale.</p>
</div>
<div class="toast" id="toast" hidden></div>
 
<script>
(function(){
  /* ================= data ================= */
  function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

  var BASE={
    filter:{n:'Filter coffee',p:120,t:'d'},cold:{n:'Cold coffee',p:180,t:'d'},matcha:{n:'Iced matcha',p:240,t:'d'},chai:{n:'Masala chai',p:70,t:'d'},cap:{n:'Cappuccino',p:170,t:'d'},
    crois:{n:'Butter croissant',p:150,t:'f'},avo:{n:'Avocado toast',p:290,t:'f'},sand:{n:'Grilled sandwich',p:210,t:'f'},pasta:{n:'Creamy pasta',p:320,t:'f'},maggi:{n:'Masala maggi',p:110,t:'f'},brown:{n:'Walnut brownie',p:160,t:'f'},cheese:{n:'Baked cheesecake',p:230,t:'f'}
  };
  var DRINKS=['filter','cold','matcha','chai','cap'],FOODS=['crois','avo','sand','pasta','maggi','brown','cheese'];
  var AREAS=[
    {s:'bandra-west',n:'Bandra West',lat:19.0596,lng:72.8295,f:1.3,coast:1,bias:['aesthetic','date'],tag:'Pastel walls, sea breeze and a queue for everything.'},
    {s:'khar',n:'Khar',lat:19.0700,lng:72.8350,f:1.25,bias:['aesthetic','date'],tag:'Lane cafés and long weekend brunches.'},
    {s:'juhu',n:'Juhu',lat:19.1075,lng:72.8263,f:1.1,coast:1,bias:['outdoor','date'],tag:'Beach walks and iced coffee in the evening.'},
    {s:'versova',n:'Versova',lat:19.1310,lng:72.8110,f:1.1,coast:1,bias:['outdoor','aesthetic'],tag:'Fishing-village lanes, indie cafés and sunset spots.'},
    {s:'andheri-west',n:'Andheri West',lat:19.1197,lng:72.8464,f:1.0,bias:['work','study'],tag:'Freelancers, students and actors sharing tables.'},
    {s:'powai',n:'Powai',lat:19.1176,lng:72.9060,f:.95,bias:['work','study'],tag:'Lake views and laptop-friendly corners.'},

    {s:'vile-parle',n:'Vile Parle',lat:19.0990,lng:72.8440,f:.8,bias:['study','budget'],tag:'Student-sized prices and long opening hours.'},
    {s:'dadar',n:'Dadar',lat:19.0178,lng:72.8478,f:.7,bias:['budget','study'],tag:'Old-school chai meets new-school brews.'},
    {s:'lower-parel',n:'Lower Parel',lat:18.9930,lng:72.8300,f:1.35,bias:['work','date'],tag:'Mill-compound cafés with premium prices.'},
    {s:'colaba',n:'Colaba',lat:18.9067,lng:72.8147,f:1.2,coast:1,bias:['date','outdoor'],tag:'Heritage buildings, causeway strolls and big cups.'}
  ];
  var A1=['Lazy','Velvet','Golden','Sunday','Neon','Moody','Little','Pink','Salt','Honey','Paper','Midnight','Cosy','Wild','Blue','Dizzy','Mellow','Crisp','Tipsy','Soft','Daydream','Retro','Quiet','Smoky','Lucky'];
  var A2=['Bean','Brew','Crumb','Sip','Cup','Corner','Pantry','Loft','Roastery','Table','Nook','Lab','Club','Garden','Studio','Counter','Kitchen','Room','Stop','Bar'];
  var combos=[];A1.forEach(function(a){A2.forEach(function(b){combos.push(a+' '+b)})});
  shuffle(combos,rng(7));
  var BLURB={
    aesthetic:['Pastel walls, hanging plants and a window seat made for photos.','Dried flowers on every table and soft lighting that flatters everyone.','A mirror wall, mismatched chairs and a latte-art counter.'],
    date:['Low lamps, a corner sofa and a dessert menu built for sharing.','Candlelit tables and a playlist quiet enough to talk over.','Cosy two-seaters and a cheesecake that comes with two forks.'],
    study:['Long wooden tables, a quiet back room and refills that never rush you.','A socket at almost every seat and no loud music after 6 pm.','Bookshelves, steady WiFi and staff who leave you to your notes.'],
    work:['Fast WiFi, shared desks and a flat white that outlasts a meeting.','A phone-call booth at the back and a lunch menu under fifteen minutes.','Big tables, plenty of sockets and a standing counter for quick calls.'],
    budget:['Honest prices, steel tumblers and a menu you can read in ten seconds.','Student-friendly portions and chai that refills for less.','No-fuss seating and a snack combo that stays under pocket money.'],

    var by={};S.visits.forEach(function(v){by[v.cafe]=(by[v.cafe]||0)+v.mine});
    var names=Object.keys(by).sort(function(a,b){return by[b]-by[a]}),mx=Math.max.apply(null,names.map(function(n){return by[n]}).concat([1]));
    $('bars').innerHTML=names.length?names.map(function(n){return '<div class="bar"><span>'+n+'</span><span class="track"><i style="width:'+by[n]/mx*100+'%"></i></span><span class="mono">'+rs(by[n])+'</span></div>'}).join(''):'<span class="muted">No visits yet. Build a bill at any café and log it.</span>';
    $('visits').innerHTML=S.visits.slice().sort(function(a,b){return b.at-a.at}).map(function(v){var i=S.visits.indexOf(v),dt=new Date(v.at).toLocaleDateString('en-IN',{day:'numeric',month:'short'});return '<li><span>'+v.cafe+' <span class="muted">· '+dt+(v.ex?' · example':'')+'</span></span><span><span class="mono">'+rs(v.mine)+'</span> <button type="button" data-del="'+i+'" aria-label="Delete visit">✕</button></span></li>'}).join('')||'<li class="muted">Empty</li>';
    var fits=CAFES.filter(function(c){return c.p1<=per}).sort(function(a,b){return b.r-a.r||a.p1-b.p1}).slice(0,9);
    $('fitnote').textContent='up to '+rs(per)+' for one';
    $('fits').innerHTML=fits.length?fits.map(cardHtml).join(''):'<div class="empty" style="grid-column:1/-1"><b>Nothing fits yet.</b><br>Raise the budget or plan fewer visits.</div>';
  }
  function pageUpdates(){
    return '<section class="ahead"><h1>Updates</h1><p>Everything that changed on Sip Radar, newest first.</p></section><section class="sec">'+
      UPDATES.map(function(u){return '<article class="panel rel"><header><h2 style="font-size:22px">'+u.t+'</h2><span class="ver">v'+u.v+' · '+u.d+'</span></header><ul>'+u.items.map(function(i){return '<li>'+i+'</li>'}).join('')+'</ul></article>'}).join('')+
      '<article class="panel rel"><header><h2 style="font-size:22px">Coming next</h2><span class="ver">idea list</span></header><ul><li>Live café data from OpenStreetMap when this runs as its own website, since this page cannot fetch outside data.</li><li>Your own reviews and photos for each café.</li><li>A weekly budget view and a share button for your saved list.</li></ul></article></section>';
  }
 
  /* ================= router ================= */
  var stack=[];
  var CURP='home';
  function getTheme(){return document.documentElement.getAttribute('data-theme')||(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}
  function nav(cur){
    var items=[['home','Home'],['budget','Budget'],['saved','♡ Saved'],['updates','Updates']];
    $('links').innerHTML=items.map(function(i){return '<a class="nl" href="#'+i[0]+'"'+(cur===i[0]?' aria-current="page"':'')+'>'+i[1]+(i[0]==='saved'?'<span class="n">'+S.favs.length+'</span>':'')+'</a>'}).join('')+'<button class="nl theme" id="themeBtn" type="button" aria-label="Switch to '+(getTheme()==='dark'?'light':'dark')+' theme">◐ '+(getTheme()==='dark'?'Light':'Dark')+'</button>';
  }
  function render(){
    var h=location.hash.replace(/^#/,''),cur='home',html='',post=null,m;
    if(h==='budget'){cur='budget';html=pageBudget();post=function(){renderBudget()}}
    else if(h==='saved'){cur='saved';html=pageSaved()}
    else if(h==='updates'){cur='updates';html=pageUpdates()}
    else if((m=h.match(/^area-(.+)$/))&&AREA[m[1]]){cur='area';var a=AREA[m[1]];html=pageArea(a);post=function(){updateArea(a)}}
    else if((m=h.match(/^cafe-(.+)$/))&&BYID[m[1]]){cur='cafe';html=pageCafe(BYID[m[1]])}
    else{html=pageHome()}
    CURP=cur;app.innerHTML=html;nav(cur);if(post)post();
    window.scrollTo(0,0);var t=app.querySelector('h1');if(t){t.setAttribute('tabindex','-1');t.focus({preventScroll:true})}
  }
  function track(){
    var r=location.hash||'#home';
    if(stack.length>1&&stack[stack.length-2]===r)stack.pop();else if(stack[stack.length-1]!==r)stack.push(r);
  }
  window.addEventListener('hashchange',function(){track();render()});
  track();
 
  /* ================= events ================= */
  function curCafe(){var m=location.hash.match(/^#cafe-(.+)$/);return m&&BYID[m[1]]}
  function curArea(){var m=location.hash.match(/^#area-(.+)$/);return m&&AREA[m[1]]}
  document.addEventListener('click',function(e){
    var t=e.target,b;
    if((b=t.closest('[data-back]'))){if(stack.length>1)history.back();else location.hash=b.dataset.back;return}
    if((b=t.closest('[data-surprise]'))){
      var pool=b.dataset.surprise==='all'?CAFES:AREA[b.dataset.surprise].list;
      location.hash='#cafe-'+pool[Math.floor(Math.random()*pool.length)].id;return}
    if((b=t.closest('[data-fav]'))){
      var id=b.dataset.fav,i=S.favs.indexOf(id);if(i<0){S.favs.push(id);toast('Saved')}else{S.favs.splice(i,1);toast('Removed from Saved')}
      save();
      var on=S.favs.indexOf(id)>=0;
      Array.prototype.forEach.call(document.querySelectorAll('[data-fav="'+id+'"]'),function(x){x.setAttribute('aria-pressed',on);x.textContent=x.classList.contains('heart')?(on?'♥':'♡'):(on?'♥ Saved':'♡ Save')});
      if(location.hash==='#saved')render();else nav(CURP);
      return}
    if((b=t.closest('[data-inc]'))){var c=curCafe(),bl=S.bills[c.id]=S.bills[c.id]||{};bl[b.dataset.inc]=(bl[b.dataset.inc]||0)+1;$('billbox').innerHTML=billHtml(c);return}
    if((b=t.closest('[data-dec]'))){var c2=curCafe(),bl2=S.bills[c2.id]=S.bills[c2.id]||{};bl2[b.dataset.dec]=Math.max(0,(bl2[b.dataset.dec]||0)-1);$('billbox').innerHTML=billHtml(c2);return}
    if((b=t.closest('[data-log]'))){
      var c3=BYID[b.dataset.log],tot=billTotal(c3),sp=S.splits[c3.id]||1;if(!tot)return;
      S.visits.push({cafe:c3.n,mine:Math.round(tot/sp),at:Date.now()});save();S.bills[c3.id]={};S.splits[c3.id]=1;$('billbox').innerHTML=billHtml(c3);toast('Logged. Budget updated.');return}
    if((b=t.closest('[data-del]'))){S.visits.splice(+b.dataset.del,1);save();renderBudget();return}
    if(t.closest('[data-clear]')){S.visits=[];save();renderBudget();return}
    if((b=t.closest('[data-avibe]'))){S.af.vibe=b.dataset.avibe;Array.prototype.forEach.call($('avibes').children,function(x){x.setAttribute('aria-pressed',x===b)});updateArea(curArea());return}
    if(t.closest('[data-aopen]')){S.af.open=!S.af.open;$('aopen').setAttribute('aria-pressed',S.af.open);updateArea(curArea());return}
    if(t.closest('#themeBtn')){document.documentElement.setAttribute('data-theme',getTheme()==='dark'?'light':'dark');nav(CURP);$('themeBtn').focus()}
  });
  document.addEventListener('input',function(e){
    var id=e.target.id;
    if(id==='hq'){
      var q=e.target.value.trim().toLowerCase(),box=$('hits');
      if(!q){box.innerHTML='';return}
      var r=CAFES.filter(function(c){return (c.n+' '+c.a+' '+c.v.join(' ')).toLowerCase().indexOf(q)>=0}).slice(0,8);
      box.innerHTML=r.length?r.map(function(c){return '<a class="hit" href="#cafe-'+c.id+'"><span><b>'+c.n+'</b> <span class="muted">· '+c.a+'</span></span><span class="price">'+rs(c.p1)+'</span></a>'}).join(''):'<div class="muted">No café matches that. Try a neighbourhood name.</div>';
    }
    if(id==='aq'){S.af.q=e.target.value;updateArea(curArea())}
    if(id==='amax'){S.af.maxp=+e.target.value;updateArea(curArea())}
    if(id==='split'){var c=curCafe();S.splits[c.id]=Math.max(1,Math.min(12,parseInt(e.target.value,10)||1));$('share').textContent=rs(billTotal(c)/S.splits[c.id])}
    if(id==='bud'){S.bud=Math.max(0,+e.target.value||0);save();renderBudget()}
    if(id==='plan'){S.plan=Math.max(1,+e.target.value||1);save();renderBudget()}
  });
  document.addEventListener('change',function(e){if(e.target.id==='asort'){S.af.sort=e.target.value;updateArea(curArea())}});
 
  render();
})();
</script>
 
</body>
</html>
